<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="manifest.json?v=20">
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#F0FDFA; --bg-soft:#CCFBF1; --card:#FFFFFF; --card-border:#5EEAD4; --text:#134E4A; --text-soft:#0D9488; --hero:#0F766E; --nav-bg: rgba(255,255,255,0.92); }
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:flex-start;background:var(--bg);}
.phone-shell{ width:100%; max-width:430px; height:100dvh; height:100svh; background:var(--bg); position:relative; overflow:hidden; display:flex; flex-direction:column; }
@media(min-width:500px){ .phone-shell{ margin-top:12px; height:calc(100dvh - 24px); border-radius:28px; border:8px solid #111; box-shadow:0 0 0 1px var(--card-border), 0 25px 80px -20px rgba(0,0,0,.4); } }
.header{height:56px; background:var(--card); border-bottom:1.5px solid var(--card-border); display:flex; align-items:center; justify-content:space-between; padding:0 14px; flex-shrink:0; padding-top:env(safe-area-inset-top)}
.theme-toggle{width:42px; height:28px; background:var(--bg-soft); border:1.5px solid var(--card-border); border-radius:99px; position:relative; cursor:pointer; display:flex; align-items:center; padding:2px}
.theme-toggle .knob{width:22px; height:22px; background:var(--hero); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; transition:.25s}
.theme-toggle.dark .knob{transform:translateX(-12px); background:#1E293B}
.pageWrap{flex:1;position:relative;background:var(--bg);overflow:hidden}
.page{position:absolute;inset:0;width:100%;height:100%;border:none;opacity:0;pointer-events:none;transition:opacity .22s;background:var(--bg);-webkit-overflow-scrolling:touch}
.page.active{opacity:1;pointer-events:auto;z-index:2}
.nav{ height:72px; margin:10px; margin-bottom:calc(10px + env(safe-area-inset-bottom)); background:var(--nav-bg); backdrop-filter:blur(24px); border:1.5px solid var(--card-border); border-radius:20px; display:flex;align-items:center;padding:6px;gap:5px;z-index:30; flex-shrink:0 }
.nav button{flex:1;height:100%;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:var(--text-soft);font-size:10px;font-weight:700;cursor:pointer;touch-action:manipulation}
.nav button.active{background:var(--hero);color:#fff}
.nav button .icon{font-size:19px}
#syncStatus{transition:.2s}
</style>
</head>
<body>
<div class="phone-shell">
  <div class="header">
    <div style="display:flex;gap:8px;align-items:center"><b>نظام عمر</b><span id="syncStatus" style="font-size:8px;background:var(--bg-soft);color:var(--text-soft);padding:3px 8px;border-radius:99px;font-weight:800;border:1px solid var(--card-border)">🟢 متصل</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><div class="knob" id="themeKnob">☀️</div></div>
    </div>
  </div>
  <div class="pageWrap">
    <iframe data-page="daily.html" src="daily.html?v=20" class="page active" title="daily" id="frame-daily"></iframe>
    <iframe data-page="attendance.html" src="about:blank" class="page" title="attendance" id="frame-att"></iframe>
    <iframe data-page="tasks.html" src="about:blank" class="page" title="tasks" id="frame-tasks"></iframe>
  </div>
  <nav class="nav">
    <button class="active" data-page="daily.html" onclick="switchPage('daily.html',this)"><span class="icon">📊</span><span>اليومية</span></button>
    <button data-page="attendance.html" onclick="switchPage('attendance.html',this)"><span class="icon">⏱️</span><span>الحضور</span></button>
    <button data-page="tasks.html" onclick="switchPage('tasks.html',this)"><span class="icon">✓</span><span>المهام</span></button>
  </nav>
</div>
<script src="drive.js?v=20"></script>
<script src="drive-sync.js?v=20"></script>
<script>
// تم حذف زر مسح الكاش نهائياً

const themes = {
  teal: {'--bg':'#F0FDFA','--bg-soft':'#CCFBF1','--card':'#FFFFFF','--card-border':'#5EEAD4','--text':'#134E4A','--text-soft':'#0D9488','--hero':'#0F766E','--nav-bg':'rgba(255,255,255,0.92)'},
  dark: {'--bg':'#020617','--bg-soft':'#1E293B','--card':'#0F172A','--card-border':'#1E293B','--text':'#F1F5F9','--text-soft':'#94A3B8','--hero':'#0F766E','--nav-bg':'rgba(15,23,42,0.92)'}
};
function applyTheme(name, broadcast=true){
  const t = themes[name] || themes.teal;
  Object.entries(t).forEach(([k,v])=> document.documentElement.style.setProperty(k,v));
  try{ localStorage.setItem('omar_theme', name); }catch(e){}
  document.body.dataset.theme = name;
  const toggle = document.getElementById('themeToggle');
  const knob = document.getElementById('themeKnob');
  if(toggle){ toggle.className = 'theme-toggle' + (name==='dark'?' dark':''); }
  if(knob){ knob.textContent = name==='dark'?'🌙':'☀️'; }
  if(broadcast){
    document.querySelectorAll('iframe.page').forEach(f=>{
      try{
        if(f.contentWindow && f.contentWindow.applyTheme) f.contentWindow.applyTheme(name, false);
        else if(f.contentWindow) Object.entries(t).forEach(([k,v])=> f.contentWindow.document.documentElement.style.setProperty(k,v));
      }catch(e){}
    });
  }
}
function toggleTheme(){
  const cur = localStorage.getItem('omar_theme')||'teal';
  const next = cur==='teal' ? 'dark' : 'teal';
  applyTheme(next, true);
}
window.applyTheme = applyTheme;

const frames=document.querySelectorAll('.page');
let currentPage='daily.html';
function switchPage(name,btn){
  if(currentPage===name) return;
  currentPage=name;
  frames.forEach(f=>{
    const is=f.dataset.page===name;
    f.classList.toggle('active',is);
    if(is && f.src.includes('about:blank')){
      f.src=name+"?v=20";
      f.onload=()=>{ try{ const cur=localStorage.getItem('omar_theme')||'teal'; if(f.contentWindow && f.contentWindow.applyTheme) f.contentWindow.applyTheme(cur,false); }catch(e){} };
    }
  });
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

applyTheme(localStorage.getItem('omar_theme')||'teal');

// تسجيل السيرفس ووركر
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js?v=20').then(()=>console.log('SW v20')).catch(()=>{});
}

// مزامنة خلفية آمنة - لا تمسح لو فاضي ابدا
window.addEventListener('load', ()=>{
  // متعملش مزامنة خلفية لو عندك بيانات محلية - ده اللي كان بيمسح
});
window.switchPage=switchPage;
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
