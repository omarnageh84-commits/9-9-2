<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>اليومية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{ --bg:#F0FDFA; --bg-soft:#CCFBF1; --card:#FFFFFF; --card-border:#5EEAD4; --text:#134E4A; --text-soft:#0D9488; --hero:#0F766E; --accent:#14B8A6; }
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
html,body{overflow-x:hidden;max-width:100vw;background:var(--bg);color:var(--text);transition:.3s}
body{padding-bottom:94px}
.app{max-width:780px;margin:0 auto;padding:8px}
.top{position:sticky;top:0;z-index:20;background:var(--card);border:1.5px solid var(--card-border);border-radius:13px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.main-tabs{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:12px;border:1.5px solid var(--card-border);margin:8px 0;overflow:auto;scrollbar-width:none}
.mtab{flex:1;white-space:nowrap;border:none;padding:9px 5px;border-radius:9px;font-weight:900;font-size:11px;cursor:pointer;background:transparent;color:var(--text-soft);min-width:60px}
.mtab.active{background:var(--hero);color:#fff}
.month-nav{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.month-nav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--card-border);background:var(--bg-soft);color:var(--text);font-weight:900;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.month-label{font-weight:900;font-size:12px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.month-label small{font-size:8px;color:var(--text-soft);font-weight:700}
.stats{display:block;margin-bottom:8px}
.kpi-grid-5{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:4px!important}
.stat{background:var(--card);border:1.5px solid var(--card-border);border-radius:10px;position:relative;overflow:hidden;min-height:62px!important;aspect-ratio:1/1!important;padding:4px 2px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
.stat::after{content:'';position:absolute;top:0;right:0;width:100%;height:3px;background:var(--hero)}
.stat small{display:block;font-size:6px!important;color:var(--text-soft);font-weight:800;margin-bottom:2px!important}
.stat b{display:block;font-size:11.5px!important;font-weight:900;line-height:1.1}
.stat.pos b{color:#16a34a}.stat.neg b{color:#ef4444}.stat.neu b{color:var(--text)}
.stat.def{cursor:pointer;border-width:2px!important}
.stat.def.active{border-color:#16a34a!important;background:#f0fdf4!important}
.stat.def.inactive{border-color:var(--card-border)!important;background:var(--bg-soft)!important;border-style:dashed!important}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.switch{position:relative;display:inline-block;width:38px;height:22px;flex:0 0 38px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#e2e8f0;transition:.25s;border-radius:20px;border:1px solid var(--card-border)}
.slider:before{position:absolute;content:'';height:16px;width:16px;left:2px;bottom:2px;background:#fff;transition:.25s;border-radius:50%}
input:checked +.slider{background:#16a34a;border-color:#16a34a}
input:checked +.slider:before{transform:translateX(16px)}
.switch-label{font-size:8px;font-weight:900;color:var(--text-soft)}
.switch-label.on{color:#16a34a}.switch-label.off{color:#ef4444}
.fixed-box{background:var(--card);border:1.5px solid var(--hero);border-radius:12px;overflow:hidden;margin-bottom:7px}
.fixed-head{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--bg-soft);user-select:none}
.fixed-body{padding:6px;display:flex;flex-direction:column;gap:4px}
.fixed-row-2{display:grid;grid-template-columns:1fr 70px 20px 1fr 70px 20px;gap:4px;align-items:center;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:8px;padding:4px}
.fixed-row-2 input{padding:6px 4px;border:1px solid var(--card-border);border-radius:6px;font-weight:800;font-size:10px;background:var(--card);color:var(--text);width:100%;text-align:center}
.fixed-row-2 input:nth-child(1),.fixed-row-2 input:nth-child(4){text-align:right;font-size:9px}
.fixed-del-sm{width:20px;height:20px;border:none;background:#fef2f2;color:#ef4444;border-radius:5px;cursor:pointer;font-weight:900;font-size:10px;display:flex;align-items:center;justify-content:center}
.fbar{background:var(--card);border:1.5px solid var(--card-border);border-radius:11px;padding:7px;margin-bottom:7px;display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:5px;align-items:center}
.fbar input,.fbar select{flex:0 0 auto;width:87px;min-width:72px;padding:6px 6px;border:1px solid var(--card-border);border-radius:8px;font-weight:700;font-size:8.5px;background:var(--bg-soft);color:var(--text)}
.tsec{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;overflow:hidden;margin-bottom:8px}
.thead{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);border-bottom:1.5px solid var(--card-border)}
.twrap{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;min-width:320px}
th{background:var(--bg-soft);padding:7px 3px;border-bottom:1px solid var(--card-border);font-size:8.5px;color:var(--text-soft);position:sticky;top:0;white-space:nowrap;text-align:center;font-weight:900}
td{padding:7px 3px;border-bottom:1px solid var(--bg-soft);text-align:center;font-weight:800;font-size:9.3px;white-space:nowrap;color:var(--text)}
.total-header{background:var(--hero)!important;color:#fff!important;padding:10px 12px!important;border-radius:12px!important;margin:12px 0 6px 0!important;display:flex!important;justify-content:space-between!important;align-items:center!important;font-weight:900!important;border:1.5px solid var(--hero)!important}
.total-header b{font-size:11px!important}
.add-row-btn{background:var(--card)!important;color:var(--hero)!important;padding:6px 12px!important;border-radius:8px!important;font-size:9px!important;font-weight:900!important;border:none!important;cursor:pointer}
.tsec.total-sec{background:var(--card)!important;border:1.5px solid var(--card-border)!important;border-radius:12px!important;overflow:hidden!important}
.fab{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:51px;height:51px;border-radius:50%;background:var(--hero);color:#fff;border:none;font-size:27px;z-index:50;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;backdrop-filter:blur(6px);align-items:flex-start;justify-content:center;padding:8px 12px 12px 12px;overflow-y:auto}
.modal.open{display:flex}
.card{background:var(--card);width:100%;max-width:420px;margin:10vh auto auto auto;border-radius:16px;padding:10px 10px 14px 10px;max-height:72vh;max-height:72dvh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.card-actions{position:sticky;bottom:0;background:var(--card);padding-top:10px;margin-top:10px;border-top:1.5px solid var(--card-border);display:flex;gap:6px;z-index:5}
.card-top-tabs{display:flex;gap:3px;background:var(--bg-soft);padding:4px;border-radius:10px;margin-bottom:7px;overflow-x:auto}
.card-ttab{flex:1;white-space:nowrap;border:none;padding:8px 5px;border-radius:8px;font-weight:900;font-size:9.3px;cursor:pointer;background:transparent;color:var(--text-soft);min-width:50px}
.card-ttab.active{background:var(--hero);color:#fff}
.group{background:var(--bg-soft);border:1px solid var(--card-border);border-radius:9px;padding:6px 8px;margin:4px 0;display:flex;gap:4px;align-items:center}
.group label{font-size:7.5px;font-weight:800;color:var(--text-soft);white-space:nowrap;min-width:28px}
.group input,.group select{flex:1;padding:7px 6px;border:1px solid var(--card-border);border-radius:7px;font-weight:700;font-size:11px;background:var(--card);width:100%;color:var(--text)}
.group input[type="number"]{font-size:15px;font-weight:900;text-align:center}
.row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin:5px 0}
.row-3 .group{margin:0!important}
.qbtn{flex:0 0 auto;min-width:36px;padding:5px 7px;border:1px solid var(--card-border);border-radius:13px;background:var(--card);font-size:8px;font-weight:800;cursor:pointer;color:var(--text)}
.qbtn.active{background:var(--hero);color:#fff;border-color:var(--hero)}
.custom-dialog{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:200;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(8px)}
.custom-dialog.open{display:flex}
.dialog-box{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:300px;border:1px solid var(--card-border);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.dialog-box h4{font-size:13px;font-weight:900;margin-bottom:10px;color:var(--text)}
.dialog-box input{width:100%;padding:10px 12px;border:1.5px solid var(--card-border);border-radius:10px;font-weight:800;font-size:13px;margin-bottom:8px;background:var(--bg-soft);color:var(--text)}
.dialog-actions{display:flex;gap:8px;margin-top:12px}
.dialog-actions button{flex:1;padding:10px;border:none;border-radius:10px;font-weight:900;font-size:11px;cursor:pointer}
.btn-cancel{background:var(--bg-soft);color:var(--text-soft);border:1px solid var(--card-border)}
.btn-confirm{background:var(--hero);color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.band-menu{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:150;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.band-menu.open{display:flex}
.band-menu-box{background:var(--card);width:100%;max-width:306px;border-radius:13px 13px 0 0;padding:7px 8px 12px 8px;border-top:1px solid var(--card-border)}
.band-menu-item{width:100%;padding:10px 8px;border:none;background:var(--bg-soft);border-radius:8px;margin:3px 0;font-weight:800;font-size:10.2px;display:flex;align-items:center;gap:7px;cursor:pointer;text-align:right;color:var(--text)}
.band-menu-item.danger{background:#fef2f2;color:#ef4444}
.band-menu-item.primary{background:var(--hero);color:#fff}
#toastBox{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:20000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:240px;max-width:340px;pointer-events:auto;animation:toastIn .3s}
.toast.ok{border-color:#16a34a;background:#f0fdf4}.toast.err{border-color:#ef4444;background:#fef2f2}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
html,body{max-width:430px;margin:0 auto!important;background:var(--bg);} body{border-left:1px solid var(--card-border);border-right:1px solid var(--card-border); min-height:100dvh;}
</style>
</head>
<body>
<div id="toastBox"></div>
<div class="app">
<div class="top"><h3 style="font-weight:900;font-size:11px">اليومية</h3><div id="today" style="font-size:8.5px;background:var(--hero);color:#fff;padding:3px 7px;border-radius:20px"></div></div>
<div class="main-tabs">
<button class="mtab active" data-t="expense" onclick="switchTab('expense')">مصروف</button>
<button class="mtab" data-t="income" onclick="switchTab('income')">دخل</button>
<button class="mtab" data-t="debt" onclick="switchTab('debt')">ديون</button>
<button class="mtab" data-t="amanat" onclick="switchTab('amanat')">أمانات</button>
<button class="mtab" data-t="total" onclick="switchTab('total')">الإجمالي</button><button class="mtab" data-t="general" onclick="switchTab('general')">العام</button>
</div>
<div id="p-expense">
<div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><div class="month-label"><span id="ml-expense">—</span><small id="ml-expense-sub"></small></div><button onclick="shiftMonth(1)">›</button></div>
<div class="stats" id="stats-expense"></div>
<div class="fixed-box" id="fixedBox">
<div class="fixed-head" onclick="toggleFixedBox()">
  <div style="display:flex;align-items:center;gap:6px">
    <b style="font-size:9px;font-weight:900">📌 إجمالي المصروفات الثابتة</b>
    <span id="fixedTotalBadge" style="background:var(--hero);color:#fff;padding:2px 6px;border-radius:20px;font-size:7.5px;font-weight:900">0</span>
  </div>
  <span id="fixedArrow" style="font-size:10px">▼</span>
</div>
<div class="fixed-body" id="fixedBody"></div>
</div>
<div class="fbar"><input id="f-exp-q" placeholder="بند" oninput="renderSimple('expense')"><select id="f-exp-w" onchange="renderSimple('expense')"><option value="">محفظة</option></select><input id="f-exp-from" type="date" onchange="renderSimple('expense')"><input id="f-exp-to" type="date" onchange="renderSimple('expense')"><button class="qbtn active" onclick="setDayFilter('expense','month')">شهر</button><button class="qbtn" onclick="setDayFilter('expense','all')">كل</button></div>
<div id="t-expense"></div>
</div>
<div id="p-income" style="display:none"><div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><div class="month-label"><span id="ml-income">—</span><small id="ml-income-sub"></small></div><button onclick="shiftMonth(1)">›</button></div><div class="stats" id="stats-income"></div><div class="fbar"><input id="f-inc-q" placeholder="بند" oninput="renderSimple('income')"><input id="f-inc-from" type="date" onchange="renderSimple('income')"><input id="f-inc-to" type="date" onchange="renderSimple('income')"><button class="qbtn active" onclick="setDayFilter('income','month')">شهر</button><button class="qbtn" onclick="setDayFilter('income','all')">كل</button></div><div id="t-income"></div></div>
<div id="p-debt" style="display:none"><div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><div class="month-label"><span id="ml-debt">—</span><small id="ml-debt-sub"></small></div><button onclick="shiftMonth(1)">›</button></div><div class="stats" id="stats-debt"></div><div class="fbar"><input id="f-debt-q" placeholder="شخص" oninput="renderDebt()"><input id="f-debt-from" type="date" onchange="renderDebt()"><input id="f-debt-to" type="date" onchange="renderDebt()"><button class="qbtn active" onclick="setDayFilter('debt','month')">شهر</button><button class="qbtn" onclick="setDayFilter('debt','all')">كل</button></div><div style="display:flex;gap:3px;background:var(--bg-soft);padding:3px;border-radius:8px;margin:4px 0"><button style="flex:1;border:none;padding:6px;border-radius:6px;font-weight:900;font-size:9.3px;cursor:pointer;background:var(--card);border:1px solid var(--card-border)" id="sdue" onclick="setDebtSub('due')">مستحق</button><button style="flex:1;border:none;padding:6px;border-radius:6px;font-weight:900;font-size:9.3px;cursor:pointer;background:transparent" id="sdef" onclick="setDebtSub('def')">مؤجل</button></div><div id="debt-due"></div><div id="debt-def" style="display:none"></div></div>
<div id="p-amanat" style="display:none"><div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><div class="month-label"><span id="ml-amanat">—</span><small id="ml-amanat-sub"></small></div><button onclick="shiftMonth(1)">›</button></div><div class="stats" id="stats-amanat"></div><div class="fbar"><input id="f-ama-q" placeholder="شخص" oninput="renderSimple('amanat')"><input id="f-ama-from" type="date" onchange="renderSimple('amanat')"><input id="f-ama-to" type="date" onchange="renderSimple('amanat')"><button class="qbtn active" onclick="setDayFilter('amanat','month')">شهر</button><button class="qbtn" onclick="setDayFilter('amanat','all')">كل</button></div><div id="t-amanat"></div></div>
<div id="p-total" style="display:none"><div class="month-nav"><div class="month-label"><span>📊 الجداول السنوية</span><small id="ml-total-sub"></small></div><div style="display:flex;gap:4px"><button onclick="shiftYear(-1)" style="width:34px;height:34px;border-radius:9px;border:1px solid var(--card-border);background:var(--bg-soft);font-weight:900">‹</button><button onclick="shiftYear(1)" style="width:34px;height:34px;border-radius:9px;border:1px solid var(--card-border);background:var(--bg-soft);font-weight:900">›</button></div></div><div class="stats" id="stats-total"></div><div class="fbar"><input id="f-total-q" placeholder="فلتر" oninput="renderTotal()" style="flex:1;min-width:150px;width:100%"></div><div id="t-total"></div></div>
</div>
<div id="p-general" style="display:none">
  <div class="month-nav"><button onclick="shiftYear(-1)">‹</button><div class="month-label"><span id="ml-general">العام</span><small id="ml-general-sub">كل الإحصائيات</small></div><button onclick="shiftYear(1)">›</button></div>
  <div class="stats" id="stats-general"></div>
  <div class="fbar">
    <input id="gen-from" type="date" onchange="renderGeneral()">
    <input id="gen-to" type="date" onchange="renderGeneral()">
    <select id="gen-type" onchange="renderGeneral()"><option value="all">الكل</option><option value="expense">مصروف</option><option value="income">دخل</option><option value="debt">ديون</option><option value="amanat">أمانات</option></select>
    <select id="gen-band" onchange="renderGeneral()"><option value="all">بند</option></select>
    <select id="gen-wallet" onchange="renderGeneral()"><option value="all">محفظة</option></select>
    <input id="gen-q" placeholder="بحث" oninput="renderGeneral()">
  </div>
  <div class="fbar" style="margin-top:-4px">
    <button class="qbtn" onclick="setGeneralRange('today')">اليوم</button>
    <button class="qbtn" onclick="setGeneralRange('week')">أسبوع</button>
    <button class="qbtn active" onclick="setGeneralRange('month')">شهر</button>
    <button class="qbtn" onclick="setGeneralRange('year')">سنة</button>
    <button class="qbtn" onclick="setGeneralRange('all')">الكل</button>
    <button class="qbtn" onclick="exportGeneralCSV()" style="margin-right:auto">📥</button>
  </div>
  <div id="t-general"></div>
</div>
<button class="fab" onclick="openAdd()">+</button>
<div class="modal" id="addModal" onclick="if(event.target==this)closeAdd()"><div class="card">
<div class="card-top-tabs">
<button class="card-ttab active" id="ct-expense" onclick="switchCardTab('expense')">مصروف</button>
<button class="card-ttab" id="ct-income" onclick="switchCardTab('income')">دخل</button>
<button class="card-ttab" id="ct-debt" onclick="switchCardTab('debt')">ديون</button>
<button class="card-ttab" id="ct-amanat" onclick="switchCardTab('amanat')">أمانات</button>
</div>
<div id="form-expense">
  <div class="row-3">
    <div class="group"><label>محفظة</label><select id="a-wallet"></select></div>
    <div class="group" style="background:var(--hero);border-color:var(--hero)"><label style="color:#fff">قيمة</label><input id="a-amount" type="number" placeholder="0" onfocus="this.select()"></div>
    <div class="group"><label>بند</label><select id="a-item" onchange="clearAmountOnBandChange()"></select></div>
  </div>
  <div class="row-3">
    <div class="group"><label>تاريخ</label><input id="a-date-expense" type="date"></div>
    <div class="group"><label>ملاحظة</label><input id="a-note" placeholder="..."></div>
    <div class="group"><label>وسائط 📎</label><input type="file" id="a-attach" accept="image/*,video/*" style="font-size:8px;padding:4px"></div>
  </div>
  <div class="group toggle-row" style="background:var(--card);margin-top:6px"><div style="display:flex;align-items:center;gap:6px"><label>الرصيد</label><span id="a-exclude-lbl" class="switch-label on">يؤثر على الرصيد</span></div><label class="switch"><input id="a-exclude-chk" type="checkbox" onchange="toggleExclude()"><span class="slider"></span></label></div>
</div>
<div id="form-debt" style="display:none">
  <div class="row-3">
    <div class="group"><label>محفظة</label><select id="a-wallet-debt"></select></div>
    <div class="group" style="background:var(--hero);border-color:var(--hero)"><label style="color:#fff">قيمة</label><input id="a-amount-debt" type="number" placeholder="0" onfocus="this.select()"></div>
    <div class="group"><label>نوع</label><select id="a-status"><option value="due">مستحق</option><option value="def">آجل</option></select></div>
  </div>
  <div class="row-3">
    <div class="group"><label>عليا/ليا</label><select id="a-direction"><option value="عليا">عليا</option><option value="ليا">ليا</option></select></div>
    <div class="group"><label>الشخص</label><select id="a-person-debt" onchange="clearAmountOnBandChange()"></select></div>
    <div class="group"><label>ملاحظة</label><input id="a-note-debt" placeholder="..."></div>
  </div>
  <div class="row-3">
    <div class="group"><label>وسائط 📎</label><input type="file" id="a-attach-debt" accept="image/*,video/*" style="font-size:8px;padding:4px"></div>
    <div class="group"><label>تاريخ الأخذ</label><input id="a-date-debt" type="date"></div>
    <div class="group"><label>تاريخ السداد</label><input id="a-date-repay" type="date"></div>
  </div>
  <div class="group toggle-row" style="background:var(--card);margin-top:6px"><div style="display:flex;align-items:center;gap:6px"><label>الرصيد</label><span id="a-exclude-lbl-debt" class="switch-label on">يؤثر على الرصيد</span></div><label class="switch"><input id="a-exclude-chk-debt" type="checkbox" onchange="toggleExclude()"><span class="slider"></span></label></div>
</div>

  <div class="row-3">
    <div class="group"><label>محفظة</label><select id="a-wallet-ama"><option>الأمانات</option></select></div>
    <div class="group" style="background:var(--hero);border-color:var(--hero)"><label style="color:#fff">قيمة</label><input id="a-amount-ama" type="number" placeholder="0" onfocus="this.select()"></div>
    <div class="group"><label>الشخص</label><select id="a-person-ama" onchange="clearAmountOnBandChange()"></select></div>
  </div>
  <div class="row-3">
    <div class="group"><label>سحب/إيداع</label><select id="a-amanat-type"><option value="ايداع">إيداع</option><option value="سحب">سحب</option></select></div>
    <div class="group"><label>تاريخ</label><input id="a-date-ama" type="date"></div>

  </div>
</div>
<div class="card-actions">
<button onclick="closeAdd()" style="flex:1;padding:8px;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:8px;font-weight:800;font-size:9.3px;color:var(--text)">إلغاء</button>
<button id="btnDelete" onclick="deleteTx()" style="display:none;flex:1;padding:8px;background:#fef2f2;color:#ef4444;border:1px solid #fecaca;border-radius:8px;font-weight:900;font-size:9.3px">مسح</button>
<button onclick="saveTx()" style="flex:1;padding:8px;background:var(--hero);color:#fff;border:none;border-radius:8px;font-weight:900;font-size:9.3px">حفظ</button>
</div>
</div></div>
<div class="custom-dialog" id="fixedModal"><div class="dialog-box"><h4>📌 إضافة مصروف ثابت</h4><input id="fixedNameInput" placeholder="اسم البند (الإيجار)" type="text"><input id="fixedAmountInput" placeholder="القيمة (5000)" type="text" inputmode="numeric"><div class="dialog-actions"><button class="btn-cancel" onclick="closeFixedModal()">إلغاء</button><button class="btn-confirm" onclick="confirmFixedModal()">إضافة</button></div></div></div>
<div class="custom-dialog" id="customPrompt"><div class="dialog-box" id="dialogInner"><h4 id="promptTitle"></h4><input id="promptInput" type="text"><div class="dialog-actions"><button class="btn-cancel" onclick="closePrompt()">إلغاء</button><button class="btn-confirm" id="promptConfirmBtn" onclick="confirmPrompt()">حسناً</button></div></div></div>
<div class="band-menu" id="bandMenu" onclick="if(event.target==this)closeBandMenu()"><div class="band-menu-box"><div style="width:27px;height:3px;background:var(--card-border);border-radius:20px;margin:0 auto 7px auto"></div><h4 id="bandMenuTitle" style="font-weight:900;font-size:10.2px;margin-bottom:5px;color:var(--text)"></h4><button class="band-menu-item primary" onclick="handleBandAction('edit')">تعديل</button><button class="band-menu-item danger" onclick="handleBandAction('delete')">مسح</button><button class="band-menu-item" onclick="closeBandMenu()" style="background:var(--bg-soft);justify-content:center">إلغاء</button></div></div>
<script>
function safeParse(k,f){try{let v=localStorage.getItem(k);if(!v||v==='undefined'||v==='null')return f;let p=JSON.parse(v);return p==null?f:p;}catch(e){try{localStorage.removeItem(k);}catch(e2){}return f;}}
function toast(m,t='ok'){let b=document.getElementById('toastBox');if(!b){b=document.createElement('div');b.id='toastBox';document.body.appendChild(b);}let el=document.createElement('div');el.className='toast '+(t==='ok'?'ok':'err');el.innerHTML=`<span>${t==='ok'?'✅':'⚠'}</span><span style="font-size:10px;font-weight:800;flex:1">${m}</span><button onclick="this.parentElement.remove()" style="background:transparent;border:none">✕</button>`;b.appendChild(el);setTimeout(()=>{try{el.remove();}catch(e){}},3000);}
let transactions=safeParse('omar_tx_v3', []);
let masterBands=safeParse('omar_master_bands', []);
let includeDeferredInBalance=safeParse('omar_include_def', false);
let wallets=safeParse('omar_wallets_v3', ["كاش","محفظة بنكية","فودافون كاش","الخزنة","الأمانات"]);
let curTab='expense',curDebtSub='due',editingId=null,cardTab='expense';
let excludeFromBalanceCurrent=false;
let currentBand=null,currentSection=null,promptCallback=null;
let curYM = new Date().toISOString().slice(0,7);
let fixedTemplates=safeParse('omar_fixed_templates', [{"id":"1","name":"الإيجار","def":5000},{"id":"2","name":"الكهرباء","def":400},{"id":"3","name":"مياه","def":200},{"id":"4","name":"غاز","def":150},{"id":"5","name":"إنترنت","def":300}]);
let fixedByMonth=safeParse('omar_fixed_by_month', {});
let fixedSaved=safeParse('omar_fixed_saved', {});
let fixedOpen=true;
function persistFixed(){localStorage.setItem('omar_fixed_templates',JSON.stringify(fixedTemplates));localStorage.setItem('omar_fixed_by_month',JSON.stringify(fixedByMonth));localStorage.setItem('omar_fixed_saved',JSON.stringify(fixedSaved));doSync();}
function getFixedForMonth(ym){try{if(!fixedByMonth[ym]){let keys=Object.keys(fixedByMonth||{}).sort();if(keys.length){try{fixedByMonth[ym]=JSON.parse(JSON.stringify(fixedByMonth[keys[keys.length-1]]))}catch(e){fixedByMonth[ym]=(fixedTemplates||[]).map(t=>({id:t.id,name:t.name,amount:t.def}))}}else{fixedByMonth[ym]=(fixedTemplates||[]).map(t=>({id:t.id,name:t.name,amount:t.def||0}))}persistFixed()}return fixedByMonth[ym]||[]}catch(e){ console.error('getFixed error',e); return (fixedTemplates||[]).map(t=>({id:t.id,name:t.name,amount:t.def||0})) }}
function toggleFixedBox(){fixedOpen=!fixedOpen;document.getElementById('fixedBody').style.display=fixedOpen?'flex':'none';document.getElementById('fixedArrow').textContent=fixedOpen?'▼':'◀'}
function renderFixedSection(){ try{ let list=getFixedForMonth(curYM);
  document.getElementById('fixedTotalBadge').textContent=list.reduce((a,b)=>a+(Number(b.amount)||0),0).toLocaleString()+' ج';
  let html='';
  for(let i=0;i<list.length;i+=2){
    let f1=list[i]; let f2=list[i+1];
    html+=`<div class="fixed-row-2">
      <input value="${(f1.name||'').replace(/"/g,'&quot;')}" onfocus="this.select()" onchange="editFixedName('${f1.id}',this.value)" placeholder="البند">
      <input type="text" inputmode="numeric" value="${f1.amount}" onfocus="this.select()" oninput="editFixedAmount('${f1.id}',this.value)">
      <button class="fixed-del-sm" onclick="deleteFixed('${f1.id}')">✕</button>
      ${f2?`<input value="${(f2.name||'').replace(/"/g,'&quot;')}" onfocus="this.select()" onchange="editFixedName('${f2.id}',this.value)" placeholder="البند"><input type="text" inputmode="numeric" value="${f2.amount}" onfocus="this.select()" oninput="editFixedAmount('${f2.id}',this.value)"><button class="fixed-del-sm" onclick="deleteFixed('${f2.id}')">✕</button>`:`<div></div><div></div><div></div>`}
    </div>`;
  }
  html+=`<div style="display:flex;gap:6px;margin-top:6px"><button onclick="openFixedModal()" style="flex:1;padding:8px;background:var(--card);color:var(--hero);border:1.5px solid var(--hero);border-radius:8px;font-weight:900;font-size:10px">+ إضافة بند ثابت</button><button onclick="saveFixedToTotal()" style="flex:1;padding:8px;background:var(--hero);color:#fff;border:none;border-radius:8px;font-weight:900;font-size:10px">💾 حفظ</button></div>`;
  let fb=document.getElementById('fixedBody'); if(fb){ fb.innerHTML=html; fb.style.display=fixedOpen?'flex':'none'; } let badge=document.getElementById('fixedTotalBadge'); if(badge) badge.textContent=(list||[]).reduce((a,b)=>a+(Number(b.amount)||0),0).toLocaleString()+' ج'; }catch(e){ console.error('renderFixed error',e); } }
function editFixedName(id,val){let it=getFixedForMonth(curYM).find(x=>x.id===id);if(it)it.name=val;let tmpl=fixedTemplates.find(x=>x.id===id);if(tmpl)tmpl.name=val;persistFixed();}
function editFixedAmount(id,val){let num=Number(val.replace(/[^0-9]/g,''))||0;let it=getFixedForMonth(curYM).find(x=>x.id===id);if(it)it.amount=num;persistFixed();document.getElementById('fixedTotalBadge').textContent=getFixedForMonth(curYM).reduce((a,b)=>a+(Number(b.amount)||0),0).toLocaleString()+' ج';renderStats(curTab);}
function openFixedModal(){document.getElementById('fixedNameInput').value='';document.getElementById('fixedAmountInput').value='';document.getElementById('fixedModal').classList.add('open');}
function closeFixedModal(){document.getElementById('fixedModal').classList.remove('open');}
function saveFixedToTotal(){
  let fixedList=getFixedForMonth(curYM);
  let added=[];
  fixedList.forEach(f=>{
    if(!masterBands.find(b=>b.name===f.name && b.section==='expense')){
      masterBands.push({id:f.id,name:f.name,section:'expense'});
      added.push(f.name);
    }
  });
  fixedSaved[curYM]=true;
  persistFixed();
  persist();
  toast('✅ اتحفظت في شهر '+curYM+' : '+(added.length?added.join('، '):'تم التحديث'),'ok');
  renderStats(curTab);
  renderTotal();
  switchTab('total');
}

function confirmFixedModal(){let name=document.getElementById('fixedNameInput').value.trim();let amount=Number(document.getElementById('fixedAmountInput').value.replace(/[^0-9]/g,''))||0;if(!name){toast('اكتب اسم البند','err');return;}let id=Date.now().toString();fixedTemplates.push({id,name,def:amount});getFixedForMonth(curYM).push({id,name,amount});persistFixed();closeFixedModal();renderFixedSection();renderStats(curTab);}
function deleteFixed(id){
  showConfirm('تمسح البند الثابت ده؟',()=>{
    fixedTemplates=fixedTemplates.filter(x=>x.id!==id);
    Object.keys(fixedByMonth).forEach(ym=>{fixedByMonth[ym]=fixedByMonth[ym].filter(x=>x.id!==id)});
    persistFixed(); renderFixedSection(); renderStats(curTab); renderTotal();
    toast('✅ اتمسح','ok');
  },true);
}
function doSync(){
  try{ 
    localStorage.setItem('omar_tx_v3',JSON.stringify(transactions)); 
    localStorage.setItem('omar_master_bands',JSON.stringify(masterBands)); 
    localStorage.setItem('omar_wallets_v3',JSON.stringify(wallets)); 
    localStorage.setItem('omar_include_def',JSON.stringify(includeDeferredInBalance));
    localStorage.setItem('omar_fixed_templates',JSON.stringify(fixedTemplates));
    localStorage.setItem('omar_fixed_by_month',JSON.stringify(fixedByMonth));
  }catch(e){}
  try{ if(window.saveToDrive) window.saveToDrive(); }catch(e){}
  try{ if(window.parent && window.parent.saveToDrive) window.parent.saveToDrive(); }catch(e){}
  try{ window.dispatchEvent(new Event('omar_data_updated')); if(window.parent) window.parent.postMessage({type:'omar_data_updated'},'*'); }catch(e){}
}
function persist(){ doSync(); }
// دي اللي drive.js بينده عليها بعد التحميل - كانت ناقصة وده سبب ان اليومية مش بتتحدث
window.initDailyFromDrive = function(){
  try{
    transactions = safeParse('omar_tx_v3', transactions);
    masterBands = safeParse('omar_master_bands', masterBands);
    wallets = safeParse('omar_wallets_v3', wallets);
    fixedTemplates = safeParse('omar_fixed_templates', fixedTemplates);
    fixedByMonth = safeParse('omar_fixed_by_month', fixedByMonth);
    fixedSaved = safeParse('omar_fixed_saved', fixedSaved);
    let incDef = localStorage.getItem('omar_include_def');
    if(incDef!==null) try{ includeDeferredInBalance = JSON.parse(incDef); }catch(e){}
    updateMonthLabels(); applyMonthToInputs(); refreshCurrent(); renderTotal();
    if(typeof toast==='function') toast('تم تحديث اليومية من الدرايف ✅','ok');
  }catch(e){ console.error('initDailyFromDrive error',e); }
}
window.initApp = window.initDailyFromDrive;
function ensureMaster(){if(masterBands.length===0){masterBands=[{id:1,name:'الإيجار',section:'expense'},{id:2,name:'الكهرباء',section:'expense'},{id:3,name:'مبيعات',section:'income'},{id:4,name:'أحمد',section:'debt_due'},{id:5,name:'سامي',section:'amanat'}];}persist()}
function getBands(sec){return masterBands.filter(b=>b.section===sec).map(b=>b.name)}
function getMonthRange(ym){const[y,m]=ym.split('-').map(Number);const first=`${ym}-01`;const lastDay=new Date(y,m,0).getDate();const last=`${ym}-${String(lastDay).padStart(2,'0')}`;return{first,last,y,m}}
function shiftYear(d){ let y=parseInt(curYM.slice(0,4))+d; curYM=`${y}-${curYM.slice(5,7)}`; updateMonthLabels(); applyMonthToInputs(); refreshCurrent(); }
function shiftMonth(d){let[y,m]=curYM.split('-').map(Number);m+=d;if(m>12){m=1;y++}if(m<1){m=12;y--}curYM=`${y}-${String(m).padStart(2,'0')}`;updateMonthLabels();applyMonthToInputs();refreshCurrent()}
function updateMonthLabels(){const{y,m}=getMonthRange(curYM);const names=['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];const label=`${names[m]} ${y}`;const sub=`${curYM}`;['expense','income','debt','amanat','total','general'].forEach(k=>{const el=document.getElementById('ml-'+k);if(el)el.textContent=label;const s=document.getElementById('ml-'+k+'-sub');if(s)s.textContent=sub})}
function applyMonthToInputs(){const{first,last}=getMonthRange(curYM);[['exp','expense'],['inc','income'],['ama','amanat'],['debt','debt']].forEach(([p])=>{const f=document.getElementById(`f-${p}-from`);const t=document.getElementById(`f-${p}-to`);if(f&&t){f.value=first;t.value=last}})}
function refreshCurrent(){ try{ renderFixedSection(); }catch(e){} try{ if(curTab==='total')renderTotal(); else if(curTab==='general')renderGeneral(); else if(curTab==='debt')renderDebt(); else renderSimple(curTab); }catch(e){ console.error('refreshCurrent',e); } }
function switchTab(t){ try{ curTab=t; document.querySelectorAll('[id^="p-"]').forEach(e=>e.style.display='none'); let pe=document.getElementById('p-'+t); if(pe) pe.style.display='block'; document.querySelectorAll('.mtab').forEach(b=>b.classList.remove('active')); let bt=document.querySelector(`.mtab[data-t="${t}"]`); if(bt) bt.classList.add('active'); refreshCurrent(); }catch(e){ console.error('switchTab',e); } }
function setDebtSub(s){curDebtSub=s;document.getElementById('sdue').style.background=s==='due'?'var(--card)':'transparent';document.getElementById('sdef').style.background=s==='def'?'var(--card)':'transparent';document.getElementById('debt-due').style.display=s==='due'?'block':'none';document.getElementById('debt-def').style.display=s==='def'?'block':'none'}
function switchCardTab(t){
  try{ if(!editingId){ ['a-amount','a-amount-debt','a-amount-ama'].forEach(id=>{let el=document.getElementById(id); if(el) el.value=''; }); } }catch(e){}
  cardTab=t;document.querySelectorAll('.card-ttab').forEach(b=>b.classList.remove('active'));document.getElementById('ct-'+t)?.classList.add('active');
  document.getElementById('form-expense').style.display=(t==='expense'||t==='income')?'block':'none';
  document.getElementById('form-debt').style.display=t==='debt'?'block':'none';
  document.getElementById('form-amanat').style.display=t==='amanat'?'block':'none';
  let list=[];if(t==='expense')list=getBands('expense');else if(t==='income')list=getBands('income');else if(t==='debt')list=[...getBands('debt_due'),...getBands('debt_def')];else if(t==='amanat')list=getBands('amanat');
  const opts=list.map(b=>`<option>${b}</option>`).join('')+'<option value="__new__">+ جديد</option>';
  if(t==='expense'||t==='income'){document.getElementById('a-item').innerHTML=opts;document.getElementById('a-wallet').innerHTML=wallets.map(w=>`<option>${w}</option>`).join('')}
  if(t==='debt'){document.getElementById('a-person-debt').innerHTML=opts;document.getElementById('a-wallet-debt').innerHTML=wallets.map(w=>`<option>${w}</option>`).join('')}
  if(t==='amanat'){document.getElementById('a-person-ama').innerHTML=opts}
  setTimeout(()=>{ let amt=document.getElementById(t==='debt'?'a-amount-debt':t==='amanat'?'a-amount-ama':'a-amount'); if(amt){ if(!editingId) amt.value=''; amt.focus(); try{amt.select();}catch(e){} } },90)
}
function setDayFilter(type,mode){const prefix=type==='expense'?'exp':type==='income'?'inc':type==='amanat'?'ama':'debt';const fromEl=document.getElementById(`f-${prefix}-from`);const toEl=document.getElementById(`f-${prefix}-to`);const today=new Date().toISOString().slice(0,10);if(mode==='today'){fromEl.value=today;toEl.value=today}else if(mode==='month'){const{first,last}=getMonthRange(curYM);fromEl.value=first;toEl.value=last}else if(mode==='all'){fromEl.value='';toEl.value=''}if(type==='debt')renderDebt();else if(type==='total')renderTotal();else renderSimple(type)}
function toggleExclude(){excludeFromBalanceCurrent=!excludeFromBalanceCurrent;updateExcludeBtn()}
function updateExcludeBtn(){const chk=document.getElementById('a-exclude-chk');const lbl=document.getElementById('a-exclude-lbl');const chk2=document.getElementById('a-exclude-chk-debt');const lbl2=document.getElementById('a-exclude-lbl-debt');[[chk,lbl],[chk2,lbl2]].forEach(pair=>{const[c,l]=pair;if(!c)return;c.checked=!excludeFromBalanceCurrent;if(l){if(excludeFromBalanceCurrent){l.textContent='لا يؤثر ✓';l.className='switch-label off'}else{l.textContent='يؤثر على الرصيد';l.className='switch-label on'}}})}
function renderStats(type){
const allMonth=transactions.filter(t=>t.date&&t.date.startsWith(curYM));
const monthList=allMonth.filter(t=>{if(t.excludeFromBalance)return false;const isDef=t.subType==='debt_def'||t.status==='def';if(isDef&&!includeDeferredInBalance)return false;return true});
const incomeMonth=monthList.filter(t=>t.type==='income').reduce((s,x)=>s+Number(x.amount),0);
let expenseMonth=monthList.filter(t=>t.type==='expense').reduce((s,x)=>s+Number(x.amount),0);
let fixedSum=0;
if(fixedSaved[curYM]){ fixedSum=getFixedForMonth(curYM).reduce((a,b)=>a+(Number(b.amount)||0),0); }
expenseMonth+=fixedSum;
let dueO=0,dueL=0;monthList.filter(t=>t.type==='debt'&&(t.subType==='debt_due'||t.status==='due')).forEach(t=>{if(t.direction==='عليا')dueO+=Number(t.amount);else dueL+=Number(t.amount)});
let defOAll=0,defLAll=0;allMonth.filter(t=>t.type==='debt'&&(t.subType==='debt_def'||t.status==='def')).forEach(t=>{if(t.direction==='عليا')defOAll+=Number(t.amount);else defLAll+=Number(t.amount)});
const debtDefNetAll=defLAll-defOAll;
const isActive=includeDeferredInBalance;
const netThere = incomeMonth - expenseMonth - dueO + dueL + (isActive ? debtDefNetAll : 0);
const top5=`<div class="kpi-grid-5">
<div class="stat pos"><small>إجمالي الدخل</small><b>${incomeMonth.toLocaleString()}</b></div>
<div class="stat neg"><small>إجمالي المصروف</small><b>${expenseMonth.toLocaleString()}</b></div>
<div class="stat neg"><small>إجمالي المستحقة</small><b>${(dueO - dueL).toLocaleString()}</b></div>
<div class="stat neu"><small>الصافي هناك</small><b>${netThere.toLocaleString()}</b></div>
<div class="stat def ${isActive?'active':'inactive'}" onclick="toggleDeferredInclude()"><span style="font-size:5px;background:${isActive?'#dcfce7':'#fee2e2'};color:${isActive?'#16a34a':'#ef4444'};padding:1px 4px;border-radius:10px">${isActive?'✅ مفعلة':'❌ مخفية'}</span><small>المؤجلة ⏳</small><b>${debtDefNetAll.toLocaleString()}</b></div>
</div>`;
document.querySelectorAll('[id^="stats-"]').forEach(el=>{
if(el.id==='stats-debt'){
let o=0,l=0,od=0,ld=0;
allMonth.filter(t=>t.type==='debt').forEach(t=>{
if(t.subType==='debt_due'||t.status==='due'){if(!t.excludeFromBalance){if(t.direction==='عليا')o+=Number(t.amount);else l+=Number(t.amount)}}
else{if(t.direction==='عليا')od+=Number(t.amount);else ld+=Number(t.amount)}
});
const safiDue = l - o; const safiDef = ld - od;
el.innerHTML=`<div style="display:flex;gap:4px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none">
  <div class="stat neg" style="min-width:88px"><small>عليا مستحق</small><b>${o.toLocaleString()}</b></div>
  <div class="stat pos" style="min-width:88px"><small>ليا مستحق</small><b>${l.toLocaleString()}</b></div>
  <div class="stat neu" style="min-width:88px;border-color:var(--hero)"><small>صافي المستحق</small><b>${safiDue.toLocaleString()}</b></div>
  <div class="stat neg" style="min-width:88px"><small>عليا مؤجل</small><b>${od.toLocaleString()}</b></div>
  <div class="stat pos" style="min-width:88px"><small>ليا مؤجل</small><b>${ld.toLocaleString()}</b></div>
  <div class="stat neu" style="min-width:88px"><small>صافي المؤجل</small><b>${safiDef.toLocaleString()}</b></div>
</div>`;
}else{el.innerHTML=top5}
});
}
function renderSimple(type){
renderStats(type);
const q=document.getElementById(type==='expense'?'f-exp-q':type==='income'?'f-inc-q':'f-ama-q')?.value||'';
const from=document.getElementById(type==='expense'?'f-exp-from':type==='income'?'f-inc-from':'f-ama-from')?.value||'';
const to=document.getElementById(type==='expense'?'f-exp-to':type==='income'?'f-inc-to':'f-ama-to')?.value||'';
let list=transactions.filter(t=>t.type===type);
if(q)list=list.filter(t=>(t.item||'').includes(q));
if(from)list=list.filter(t=>t.date>=from);
if(to)list=list.filter(t=>t.date<=to);
list=list.sort((a,b)=>new Date(b.date)-new Date(a.date));
let title=type==='expense'?'مصروف':type==='income'?'دخل':'أمانات';

function renderDebt(){
renderStats('debt');
const q=document.getElementById('f-debt-q')?.value||'';
const from=document.getElementById('f-debt-from')?.value||'';
const to=document.getElementById('f-debt-to')?.value||'';
let due=transactions.filter(t=>t.subType==='debt_due'||(t.type==='debt'&&t.status==='due'));
let def=transactions.filter(t=>t.subType==='debt_def'||(t.type==='debt'&&t.status==='def'));
if(q){due=due.filter(t=>(t.person||'').includes(q));def=def.filter(t=>(t.person||'').includes(q))}
if(from){due=due.filter(t=>t.date>=from);def=def.filter(t=>t.date>=from)}
if(to){due=due.filter(t=>t.date<=to);def=def.filter(t=>t.date<=to)}
function build(list){
const groups={};list.forEach(t=>{const k=t.person||t.item;if(!groups[k])groups[k]=[];groups[k].push(t)});
let h='';Object.keys(groups).forEach(person=>{
const items=groups[person].sort((a,b)=>new Date(b.date)-new Date(a.date));
let olya=0,leya=0;items.forEach(t=>{if(t.direction==='عليا')olya+=Number(t.amount);else leya+=Number(t.amount)});
const rem=olya-leya;
h+=`<div class="tsec"><div class="thead"><b style="font-size:10.2px">${person}</b><span style="background:var(--hero);color:#fff;padding:2px 5px;border-radius:10px;font-size:7px">${rem.toLocaleString()}</span></div><div class="twrap"><table><thead><tr><th>تاريخ</th><th>شخص</th><th>ع/ل</th><th>قيمة</th></tr></thead><tbody>${items.map(t=>`<tr><td>${t.date.slice(5)}</td><td>${t.person}</td><td>${t.direction==='عليا'?'ع':'ل'}</td><td>${Number(t.amount).toLocaleString()} <button onclick="openEdit('${t.id}')" style="border:none;background:var(--bg-soft);padding:2px 4px;border-radius:4px;font-size:7px">✏</button> <button onclick="confirmDeleteDaily('${t.id}')" style="border:none;background:#fef2f2;padding:2px 4px;border-radius:4px;font-size:7px">🗑</button></td></tr>`).join('')}</tbody></table></div></div>`;
});return h||'<div style="padding:8px;text-align:center;color:var(--text-soft);background:var(--card);border-radius:8px">لا يوجد</div>';
}
document.getElementById('debt-due').innerHTML=build(due);document.getElementById('debt-def').innerHTML=build(def);
}

function renderTotal(){
  try{ renderStats('total'); }catch(e){}
  const q=(document.getElementById('f-total-q')?.value||'').trim();
  const months=Array.from({length:12},(_,i)=>i+1);
  const yearPrefix=curYM.slice(0,4);
  let sub=document.getElementById('ml-total-sub'); if(sub) sub.textContent=yearPrefix;
  const sections=[
    {key:'wallet',title:'المحافظ',isWallet:true},
    {key:'income',title:'الدخل',filter:t=>t.type==='income'},
    {key:'expense',title:'المصروف',filter:t=>t.type==='expense'},
    {key:'debt_due',title:'الديون المستحقة',filter:t=>t.subType==='debt_due'||(t.type==='debt'&&t.status==='due')},
    {key:'debt_def',title:'الديون المؤجلة',filter:t=>t.subType==='debt_def'||(t.type==='debt'&&t.status==='def')},
    {key:'amanat',title:'الأمانات',filter:t=>t.type==='amanat'}
  ];
  let html='';
  sections.forEach(sec=>{
    if(sec.isWallet){
      let walletNames=wallets.filter(w=>w!=='الأمانات');
      if(q) walletNames=walletNames.filter(n=>n.includes(q));
      const yearFiltered=transactions.filter(t=>t.date&&t.date.startsWith(yearPrefix)&&walletNames.includes(t.wallet));
      html+=`<div class="total-header"><span></span><span style="font-size:12px;font-weight:900">${yearFiltered.reduce((a,b)=>a+(Number(b.amount)||0),0).toLocaleString()}</span><b>${sec.title} (${yearPrefix})</b></div>`;
      html+=`<div class="tsec total-sec"><div class="twrap"><table><thead><tr><th style="min-width:80px">بند</th>${months.map(m=>`<th>${m}</th>`).join('')}<th>إجمالي</th></tr></thead><tbody>`;
      walletNames.forEach(wName=>{
        const items=transactions.filter(t=>t.wallet===wName);
        const perMonth=Array(12).fill(0);
        items.forEach(t=>{const d=new Date(t.date); if(!isNaN(d)&&String(d.getFullYear())===yearPrefix) perMonth[d.getMonth()]+=(Number(t.amount)||0);});
        html+=`<tr><td style="font-weight:900">${wName}</td>${perMonth.map((v,idx)=>`<td onclick="openCell('${wName.replace(/'/g,"\'")}',${idx},'wallet')" style="cursor:pointer">${v?v.toLocaleString():'-'}</td>`).join('')}<td style="font-weight:900;color:var(--hero)">${perMonth.reduce((a,c)=>a+c,0).toLocaleString()}</td></tr>`;
      });
      html+=`</tbody></table></div></div>`; return;
    }
    let bands=masterBands.filter(b=>b.section===sec.key);
    const existNames=new Set(bands.map(b=>b.name));
    transactions.filter(t=>t.date&&t.date.startsWith(yearPrefix)&&sec.filter(t)).forEach(t=>{
      const nm=(t.person||t.item||'').trim();
      if(nm && !existNames.has(nm)){ masterBands.push({id:Date.now()+Math.random()*1000,name:nm,section:sec.key}); existNames.add(nm); bands.push({name:nm,section:sec.key}); }
    });
    if(sec.key==='expense'){
      for(let m=1;m<=12;m++){ let ym=`${yearPrefix}-${String(m).padStart(2,'0')}`; if(fixedSaved[ym]){ (fixedByMonth[ym]||[]).forEach(f=>{ if(!existNames.has(f.name)){ bands.push({name:f.name,section:'expense'}); existNames.add(f.name); } }); } }
    }
    if(q) bands=bands.filter(b=>b.name.includes(q));
    let list=transactions.filter(t=>t.date&&t.date.startsWith(yearPrefix)&&sec.filter(t));
    let fixedYearSum=0;
    if(sec.key==='expense'){ for(let m=1;m<=12;m++){ let ym=`${yearPrefix}-${String(m).padStart(2,'0')}`; if(fixedSaved[ym]) fixedYearSum+=(fixedByMonth[ym]||[]).reduce((a,b)=>a+(Number(b.amount)||0),0); } }
    html+=`<div class="total-header"><button class="add-row-btn" onclick="addNewRow('${sec.key}')">+ بند</button><span style="font-size:12px;font-weight:900">${(list.reduce((a,b)=>a+(Number(b.amount)||0),0)+fixedYearSum).toLocaleString()}</span><b>${sec.title} (${yearPrefix})</b></div>`;
    html+=`<div class="tsec total-sec"><div class="twrap"><table><thead><tr><th style="min-width:80px">بند</th>${months.map(m=>`<th>${m}</th>`).join('')}<th>إجمالي</th></tr></thead><tbody>`;
    bands.forEach(b=>{
      const band=b.name;
      const items=list.filter(t=> (t.item===band || t.person===band) );
      const perMonth=Array(12).fill(0);
      items.forEach(t=>{const d=new Date(t.date); if(!isNaN(d)&&String(d.getFullYear())===yearPrefix) perMonth[d.getMonth()]+=(Number(t.amount)||0);});
      if(sec.key==='expense'){ for(let m=1;m<=12;m++){ let ym=`${yearPrefix}-${String(m).padStart(2,'0')}`; if(fixedSaved[ym]){ let f=(fixedByMonth[ym]||[]).find(x=>x.name===band); if(f) perMonth[m-1]+=Number(f.amount||0); } } }
      const total=perMonth.reduce((a,c)=>a+c,0);
      if(total===0) return;
      let hasFixed=false; if(sec.key==='expense'){ for(let m=1;m<=12;m++){ let ym=`${yearPrefix}-${String(m).padStart(2,'0')}`; if(fixedSaved[ym] && (fixedByMonth[ym]||[]).find(x=>x.name===band)) hasFixed=true; } }
      let badge=hasFixed?' <span style="font-size:6px;background:var(--hero);color:#fff;padding:1px 4px;border-radius:8px">ثابت</span>':'';
      html+=`<tr><td onclick="openBandMenu('${band.replace(/'/g,"\'")}','${sec.key}')" style="cursor:pointer;font-weight:900">${band}${badge}</td>${perMonth.map((v,idx)=>`<td onclick="openCell('${band.replace(/'/g,"\'")}',${idx},'${sec.key}')" style="cursor:pointer;${v?'background:var(--bg-soft);font-weight:900;color:var(--hero)':''}">${v?v.toLocaleString():'-'}</td>`).join('')}<td style="font-weight:900;color:var(--hero)">${total.toLocaleString()}</td></tr>`;
    });
    html+=`</tbody></table></div></div>`;
  });
  let el=document.getElementById('t-total'); if(el) el.innerHTML=html;
}


function openCell(band,monthIdx,section){
  let year=curYM.slice(0,4);
  let month=monthIdx+1;
  let ym=`${year}-${String(month).padStart(2,'0')}`;
  let dayList=transactions.filter(t=>{
    if(!t.date) return false;
    if(!t.date.startsWith(ym)) return false;
    if(section==='expense' && t.type!=='expense') return false;
    if(section==='income' && t.type!=='income') return false;
    if(section==='debt_due' && !(t.subType==='debt_due' || (t.type==='debt'&&t.status==='due'))) return false;
    if(section==='debt_def' && !(t.subType==='debt_def' || (t.type==='debt'&&t.status==='def'))) return false;
    if(section==='wallet' && t.wallet!==band) return false;
    if(section!=='wallet' && (t.item!==band && t.person!==band)) return false;
    return true;
  });
  if(section==='expense' && fixedSaved[ym]){
    let f=(fixedByMonth[ym]||[]).find(x=>x.name===band);
    if(f){ openFixedEditDialog(band,ym); return; }
  }
  if(dayList.length===0){ toast('مفيش حركات في '+ym+' لبند '+band,'err'); return; }
  if(dayList.length===1){ openEdit(dayList[0].id); return; }
  let dialog=document.getElementById('customPrompt'); restoreDialog();
  let htmlInner=`<div class="dialog-box"><h4>📋 ${band} - ${ym} (${dayList.length})</h4><div style="max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:4px;margin:8px 0">`+
    dayList.map(t=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px;background:var(--bg-soft);border-radius:8px"><span style="font-size:8px">${t.date} - ${t.item||t.person} - ${Number(t.amount).toLocaleString()}</span><div style="display:flex;gap:4px"><button class="btn-confirm" style="padding:4px 8px;font-size:8px" onclick="closePrompt();restoreDialog();openEdit('${t.id}')">تعديل</button><button class="btn-danger" style="padding:4px 8px;font-size:8px" onclick="closePrompt();restoreDialog();setTimeout(()=>confirmDeleteDaily('${t.id}'),80)">🗑</button></div></div>`).join('')+
    `</div><div class="dialog-actions"><button class="btn-cancel" onclick="closePrompt();restoreDialog()">إغلاق</button></div></div>`;
  dialog.innerHTML=htmlInner;
  dialog.classList.add('open');
}

function setGeneralRange(mode){
  const fromEl=document.getElementById('gen-from');
  const toEl=document.getElementById('gen-to');
  const today=new Date().toISOString().slice(0,10);
  const ym=getMonthRange(curYM);
  if(mode==='today'){fromEl.value=today;toEl.value=today}
  else if(mode==='week'){let d=new Date();d.setDate(d.getDate()-6);fromEl.value=d.toISOString().slice(0,10);toEl.value=today}
  else if(mode==='month'){fromEl.value=ym.first;toEl.value=ym.last}
  else if(mode==='year'){fromEl.value=`${curYM.slice(0,4)}-01-01`;toEl.value=`${curYM.slice(0,4)}-12-31`}
  else{fromEl.value='';toEl.value=''}
  renderGeneral();
}

function renderGeneral(){
  try{ renderStats('general'); }catch(e){}
  const from=document.getElementById('gen-from')?.value||'';
  const to=document.getElementById('gen-to')?.value||'';
  const type=document.getElementById('gen-type')?.value||'all';
  const band=document.getElementById('gen-band')?.value||'all';
  const wallet=document.getElementById('gen-wallet')?.value||'all';
  const q=(document.getElementById('gen-q')?.value||'').trim();
  // populate band/wallet selects once
  let bandSel=document.getElementById('gen-band');
  if(bandSel && bandSel.options.length<=1){
    let allBands=[...new Set(masterBands.map(b=>b.name))];
    allBands.forEach(b=>{let o=document.createElement('option');o.value=b;o.textContent=b;bandSel.appendChild(o);});
  }
  let walletSel=document.getElementById('gen-wallet');
  if(walletSel && walletSel.options.length<=1){
    wallets.forEach(w=>{let o=document.createElement('option');o.value=w;o.textContent=w;walletSel.appendChild(o);});
  }
  let list=[...transactions];
  // add fixed saved as virtual transactions for stats
  if(type==='all' || type==='expense'){
    Object.keys(fixedSaved).forEach(ym=>{
      if(!fixedSaved[ym]) return;
      (fixedByMonth[ym]||[]).forEach(f=>{
        list.push({id:'fixed-'+ym+'-'+f.id,date:ym+'-15',item:f.name,person:f.name,wallet:'ثابت',amount:f.amount,type:'expense',isFixed:true,ym});
      });
    });
  }
  if(from) list=list.filter(t=>t.date>=from);
  if(to) list=list.filter(t=>t.date<=to);
  if(type!=='all') list=list.filter(t=>t.type===type);
  if(band!=='all') list=list.filter(t=>(t.item===band||t.person===band));
  if(wallet!=='all') list=list.filter(t=>t.wallet===wallet);
  if(q) list=list.filter(t=>(t.item||'').includes(q)||(t.note||'').includes(q));
  list=list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  let inc=list.filter(t=>t.type==='income').reduce((s,x)=>s+Number(x.amount),0);
  let exp=list.filter(t=>t.type==='expense').reduce((s,x)=>s+Number(x.amount),0);
  let net=inc-exp;
  let html=`<div class="kpi-grid-5" style="margin-bottom:6px"><div class="stat pos"><small>دخل</small><b>${inc.toLocaleString()}</b></div><div class="stat neg"><small>مصروف</small><b>${exp.toLocaleString()}</b></div><div class="stat neu"><small>صافي</small><b>${net.toLocaleString()}</b></div><div class="stat neu"><small>عدد</small><b>${list.length}</b></div><div class="stat neu"><small>متوسط يومي</small><b>${list.length?Math.round(exp/30).toLocaleString():0}</b></div></div>`;
  // chart monthly
  let year=curYM.slice(0,4);
  let monthsAr=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  let chartData=[];
  for(let m=1;m<=12;m++){
    let ym=`${year}-${String(m).padStart(2,'0')}`;
    let mList=list.filter(t=>t.date&&t.date.startsWith(ym));
    chartData.push({label:monthsAr[m-1],inc:mList.filter(t=>t.type==='income').reduce((s,x)=>s+Number(x.amount),0),exp:mList.filter(t=>t.type==='expense').reduce((s,x)=>s+Number(x.amount),0)});
  }
  let maxVal=Math.max(1,...chartData.map(d=>Math.max(d.inc,d.exp)));
  html+=`<div class="tsec" style="padding:6px"><b style="font-size:9px">📈 اتجاه شهري ${year}</b><div style="display:flex;align-items:end;gap:2px;height:55px;margin-top:6px">`+
    chartData.map(d=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px"><div style="width:100%;display:flex;gap:1px;align-items:end;justify-content:center"><div style="flex:1;background:#16a34a;height:${Math.round(d.inc/maxVal*40)}px;border-radius:2px"></div><div style="flex:1;background:#ef4444;height:${Math.round(d.exp/maxVal*40)}px;border-radius:2px"></div></div><small style="font-size:5px">${d.label.slice(0,2)}</small></div>`).join('')+
    `</div></div>`;
  // top expenses
  let topMap={};
  list.filter(t=>t.type==='expense').forEach(t=>{let k=t.item||t.person;topMap[k]=(topMap[k]||0)+Number(t.amount);});
  let topArr=Object.entries(topMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(topArr.length) html+=`<div class="tsec" style="padding:6px"><b style="font-size:9px">🔥 أعلى مصروفات</b><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">`+topArr.map(([k,v])=>`<span style="background:var(--bg-soft);border:1px solid var(--card-border);padding:3px 6px;border-radius:20px;font-size:7px;font-weight:900">${k}: ${v.toLocaleString()}</span>`).join('')+`</div></div>`;
  // wallets
  let walletMap={};
  list.forEach(t=>{if(t.wallet) walletMap[t.wallet]=(walletMap[t.wallet]||0)+Number(t.amount);});
  let walletArr=Object.entries(walletMap);
  if(walletArr.length) html+=`<div class="tsec" style="padding:6px"><b style="font-size:9px">💳 المحافظ</b><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">`+walletArr.map(([k,v])=>`<span style="background:var(--card);border:1px solid var(--card-border);padding:3px 6px;border-radius:20px;font-size:7px;font-weight:900">${k}: ${v.toLocaleString()}</span>`).join('')+`</div></div>`;
  html+=`<div class="tsec"><div class="thead"><b style="font-size:10px">📋 كل الحركات (${list.length})</b></div><div class="twrap"><table><thead><tr><th>تاريخ</th><th>بند</th><th>محفظة</th><th>قيمة</th></tr></thead><tbody>`+
    list.slice(0,500).map(t=>`<tr onclick="${t.isFixed?`openFixedEditDialog('${(t.item||'').replace(/'/g,"\'")}','${t.ym}')`:`openEdit('${t.id}')`}" style="cursor:pointer"><td style="background:var(--bg-soft)">${t.date.slice(5)}</td><td>${t.item||t.person}${t.isFixed?' <span style="font-size:6px;background:var(--hero);color:#fff;padding:1px 3px;border-radius:8px">ثابت</span>':''}</td><td>${t.wallet||''}</td><td style="font-weight:900;color:${t.type==='income'?'#16a34a':'var(--hero)'}">${Number(t.amount).toLocaleString()}</td></tr>`).join('')+
    `</tbody></table></div></div>`;
  document.getElementById('t-general').innerHTML=html;
  let sub=document.getElementById('ml-general-sub'); if(sub) sub.textContent=`${year} - ${list.length} حركة`;
}

function openAdd(){
  editingId=null; excludeFromBalanceCurrent=false; try{updateExcludeBtn()}catch(e){}
  cardTab='expense'; switchCardTab(cardTab);
  let delBtn=document.getElementById('btnDelete');if(delBtn) delBtn.style.display='none';
  const todayISO=new Date().toISOString().slice(0,10);
  ['a-amount','a-amount-debt','a-amount-ama'].forEach(id=>{let el=document.getElementById(id); if(el) el.value='';});
  ['a-note','a-note-debt','a-note-ama'].forEach(id=>{let el=document.getElementById(id); if(el) el.value='';});
  document.getElementById('a-date-expense').value=todayISO;
  document.getElementById('a-date-debt').value=todayISO;
  document.getElementById('a-date-ama').value=todayISO;
  document.getElementById('a-date-repay').value='';
  document.getElementById('addModal').classList.add('open');
  setTimeout(()=>{ let amt=document.getElementById('a-amount'); if(amt){ amt.focus(); amt.select(); } },200);
}
function closeAdd(){document.getElementById('addModal').classList.remove('open');editingId=null;}
function saveTx(){
let type=cardTab;let item,person,wallet,amount,date,note,direction,status;
if(type==='expense'||type==='income'){
  item=document.getElementById('a-item').value; wallet=document.getElementById('a-wallet').value;
  amount=document.getElementById('a-amount').value; date=document.getElementById('a-date-expense').value;
  note=document.getElementById('a-note').value;
  if(item==='__new__'){ showPrompt('اسم البند الجديد', '', (newName)=>{ if(!newName) return; newName=newName.trim(); if(!newName) return; let sec=type==='income'?'income':'expense'; if(masterBands.find(b=>b.name===newName && b.section===sec)){ toast('البند موجود','err'); return; } masterBands.push({id:Date.now(),name:newName,section:sec}); document.getElementById('a-item').innerHTML=getBands(sec).map(b=>`<option>${b}</option>`).join('')+'<option value="__new__">+ جديد</option>'; document.getElementById('a-item').value=newName; persist(); setTimeout(()=>saveTx(),150); }); return; }
  person=item;
}else if(type==='debt'){
  item=document.getElementById('a-person-debt').value; person=item; wallet=document.getElementById('a-wallet-debt').value;
  amount=document.getElementById('a-amount-debt').value; date=document.getElementById('a-date-debt').value;
  note=document.getElementById('a-note-debt').value; direction=document.getElementById('a-direction').value; status=document.getElementById('a-status').value;
  if(item==='__new__'){ showPrompt('اسم الشخص الجديد', '', (newName)=>{ if(!newName) return; newName=newName.trim(); if(!newName) return; let sec=status==='due'?'debt_due':'debt_def'; if(masterBands.find(b=>b.name===newName && b.section===sec)){ toast('موجود','err'); return; } masterBands.push({id:Date.now(),name:newName,section:sec}); let all=[...getBands('debt_due'),...getBands('debt_def')]; document.getElementById('a-person-debt').innerHTML=all.map(b=>`<option>${b}</option>`).join('')+'<option value="__new__">+ جديد</option>'; document.getElementById('a-person-debt').value=newName; persist(); setTimeout(()=>saveTx(),150); }); return; }
}else if(type==='amanat'){
  item=document.getElementById('a-person-ama').value; person=item; wallet='الأمانات';
  amount=document.getElementById('a-amount-ama').value; date=document.getElementById('a-date-ama').value; note=document.getElementById('a-note-ama').value;
  if(item==='__new__'){ showPrompt('اسم الشخص الجديد', '', (newName)=>{ if(!newName) return; newName=newName.trim(); if(!newName) return; if(masterBands.find(b=>b.name===newName && b.section==='amanat')){ toast('موجود','err'); return; } masterBands.push({id:Date.now(),name:newName,section:'amanat'}); document.getElementById('a-person-ama').innerHTML=getBands('amanat').map(b=>`<option>${b}</option>`).join('')+'<option value="__new__">+ جديد</option>'; document.getElementById('a-person-ama').value=newName; persist(); setTimeout(()=>saveTx(),150); }); return; }
}
if(!amount||Number(amount)===0){toast('اكتب القيمة أولاً','err');return}
const payload={id:editingId||Date.now().toString(),type:type,subType:type==='debt'?(status==='due'?'debt_due':'debt_def'):type,item,person,wallet,amount:Number(amount)||0,date:date||new Date().toISOString().slice(0,10),note,direction:direction||'عليا',status:status||'',excludeFromBalance:excludeFromBalanceCurrent};
if(editingId){const idx=transactions.findIndex(t=>t.id===editingId);if(idx>=0)transactions[idx]={...transactions[idx],...payload}}else transactions.push(payload);
persist();closeAdd();refreshCurrent();renderTotal();toast('تم الحفظ ✅','ok');
}
(function init(){
  try{let e=document.getElementById('today');if(e)e.textContent=new Date().toLocaleDateString('ar-EG');}catch(e){}
  try{ensureMaster();}catch(e){}
  try{updateMonthLabels();}catch(e){}
  try{applyMonthToInputs();}catch(e){}
  try{switchTab('expense');}catch(e){console.error(e);}
})();
</script>

<script>
// توحيد الثيم مع المهام - نفس طريقة المهام
if(!window.applyTheme || window.applyTheme.toString().includes('themes[name] || themes.light')){
  window.applyTheme = function(name, save=true){
    const map = {
      teal: {'--bg':'#F0FDFA','--bg-soft':'#CCFBF1','--card':'#FFFFFF','--card-border':'#5EEAD4','--text':'#134E4A','--text-soft':'#0D9488','--hero':'#0F766E'},
      green: {'--bg':'#F0FDFA','--bg-soft':'#CCFBF1','--card':'#FFFFFF','--card-border':'#5EEAD4','--text':'#134E4A','--text-soft':'#0D9488','--hero':'#0F766E'},
      light: {'--bg':'#F0FDFA','--bg-soft':'#CCFBF1','--card':'#FFFFFF','--card-border':'#5EEAD4','--text':'#134E4A','--text-soft':'#0D9488','--hero':'#0F766E'},
      dark: {'--bg':'#020617','--bg-soft':'#1E293B','--card':'#0F172A','--card-border':'#1E293B','--text':'#F1F5F9','--text-soft':'#94A3B8','--hero':'#0F766E'}
    };
    let t = map[name] || map.teal;
    Object.entries(t).forEach(([k,v])=> document.documentElement.style.setProperty(k,v));
    if(save) try{localStorage.setItem('omar_theme', name);}catch(e){}
  };
  try{
    let s = localStorage.getItem('omar_theme') || 'teal';
    window.applyTheme(s, false);
  }catch(e){}
}
